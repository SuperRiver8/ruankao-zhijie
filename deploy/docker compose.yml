name: ruankao-zhijie
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      PGTZ: Asia/Shanghai
      POSTGRES_DB: ruankao_zhijie
      POSTGRES_USER: zhijie
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?请配置 DATABASE_PASSWORD}
    command: ['postgres', '-c', 'timezone=Asia/Shanghai', '-c', 'log_timezone=Asia/Shanghai']
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U zhijie -d ruankao_zhijie']
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD-SHELL', 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 20
  api:
    restart: unless-stopped
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TZ: Asia/Shanghai
      SESSION_STORE: redis
      TRUSTED_PROXIES: ${AUTH_PROXY_IP:-172.30.240.10}
      CAPTCHA_WINDOW_SECONDS: ${CAPTCHA_WINDOW_SECONDS:-120}
      CAPTCHA_FAILURE_THRESHOLD: ${CAPTCHA_FAILURE_THRESHOLD:-2}
      CAPTCHA_TTL_SECONDS: ${CAPTCHA_TTL_SECONDS:-120}
      CAPTCHA_TOLERANCE: ${CAPTCHA_TOLERANCE:-5}
      CAPTCHA_ISSUE_LIMIT: ${CAPTCHA_ISSUE_LIMIT:-30}
      CAPTCHA_ISSUE_WINDOW_SECONDS: ${CAPTCHA_ISSUE_WINDOW_SECONDS:-60}
      JOBS_ENABLED: ${JOBS_ENABLED:-true}
      API_DOCS_ENABLED: ${API_DOCS_ENABLED:-false}
      DATABASE_URL: jdbc:postgresql://postgres:5432/ruankao_zhijie
      DATABASE_USER: zhijie
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请配置 ENCRYPTION_KEY}
      ATTACHMENT_DIR: /data/attachments
      CORS_ORIGIN: http://${SERVER_HOST:?请配置 SERVER_HOST}:${CUSTOMER_PORT:-5173},http://${SERVER_HOST}:${ADMIN_PORT:-5174}
    volumes: ['./attachments:/data/attachments']
    networks:
      default:
      auth-proxy:
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O /dev/null http://127.0.0.1:8080/actuator/health']
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 12
  web:
    image: nginx:alpine
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports: ['${CUSTOMER_PORT:-5173}:80', '${ADMIN_PORT:-5174}:81']
    volumes:
      - ./nginx/nginx.cnf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend/customer:/usr/share/nginx/mobile:ro
      - ./frontend/admin:/usr/share/nginx/admin:ro
    depends_on:
      api: { condition: service_healthy }
    networks:
      auth-proxy:
        ipv4_address: ${AUTH_PROXY_IP:-172.30.240.10}
networks:
  auth-proxy:
    ipam:
      config:
        - subnet: ${AUTH_PROXY_SUBNET:-172.30.240.0/24}
volumes:
  redis-data:
