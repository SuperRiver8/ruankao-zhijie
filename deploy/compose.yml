name: ruankao-zhijie
services:
  postgres:
    image: postgres:17-alpine
    environment:
      # 业务数据库由 sql/000_create_database.sql 手动创建。
      POSTGRES_DB: postgres
      POSTGRES_USER: zhijie
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?请配置 DATABASE_PASSWORD}
    ports: ['127.0.0.1:5432:5432']
    volumes: ['postgres-data:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U zhijie -d postgres']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请配置 REDIS_PASSWORD}
    command: ['sh', '-c', 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    ports: ['127.0.0.1:6379:6379']
    volumes: ['redis-data:/data']
  api:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SESSION_STORE: redis
      DATABASE_URL: jdbc:postgresql://postgres:5432/ruankao_zhijie
      DATABASE_USER: zhijie
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请配置 JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?请配置 ENCRYPTION_KEY}
      ATTACHMENT_DIR: /data/attachments
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173,http://localhost:5174}
    ports: ['127.0.0.1:8080:8080']
    volumes: ['../data/attachments:/data/attachments']
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
  web:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    ports: ['127.0.0.1:5173:80', '127.0.0.1:5174:81']
    depends_on: [api]
volumes:
  postgres-data:
  redis-data:
